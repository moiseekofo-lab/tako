<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#061F68" />
    <title>Connexion chauffeur | TaKo Transport</title>
    <meta name="description" content="Connexion sécurisée à l’espace chauffeur TaKo Transport." />
    <link rel="icon" type="image/png" href="/tako-logo.png" />
    <link rel="apple-touch-icon" href="/tako-logo.png" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; background: #f5f8ff; }
      body { overflow: hidden; font-family: Arial, sans-serif; }
      .top {
        position: fixed;
        z-index: 2;
        top: 14px;
        left: 16px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid #dce5f2;
        border-radius: 8px;
        color: #061f68;
        background: rgba(255,255,255,.95);
        text-decoration: none;
        font-weight: 800;
        box-shadow: 0 8px 24px rgba(6,31,104,.1);
      }
      iframe { width: 100%; height: 100%; border: 0; display: block; }
    </style>
  </head>
  <body>
    <a class="top" href="/" aria-label="Retour au site public">← Retour au site</a>
    <iframe
      title="Connexion chauffeur TaKo Transport"
      src="https://admin.takotransport.online/login?access=chauffeur"
      allow="camera; clipboard-read; clipboard-write"
    ></iframe>
  </body>
</html>
