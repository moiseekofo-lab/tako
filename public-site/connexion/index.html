<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#061F68" />
    <title>Connexion chauffeur | TaKo Transport</title>
    <meta name="description" content="Connexion sécurisée à l’espace chauffeur TaKo Transport." />
    <link rel="icon" type="image/png" href="/tako-logo.png" />
    <link rel="apple-touch-icon" href="/tako-logo.png" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; background: #f5f8ff; }
      body { overflow: hidden; font-family: Arial, sans-serif; }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        opacity: 0;
        visibility: hidden;
        transition: opacity 120ms ease;
      }
      body.driver-ready iframe {
        opacity: 1;
        visibility: visible;
      }
      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        background: #f5f8ff;
      }
      body.driver-ready .loading-screen { display: none; }
      .loading-dot {
        width: 34px;
        height: 34px;
        border: 4px solid #dbe8ff;
        border-top-color: #0b6ff4;
        border-radius: 50%;
        animation: loading-spin 700ms linear infinite;
      }
      @keyframes loading-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="loading-screen" aria-label="Chargement">
      <div class="loading-dot"></div>
    </div>
    <iframe
      id="driver-login-frame"
      title="Connexion chauffeur TaKo Transport"
      allow="camera; clipboard-read; clipboard-write"
    ></iframe>
    <script>
      const driverFrame = document.getElementById('driver-login-frame');
      const DRIVER_CONNECTED_KEY = 'tako:driverConnected';
      const ADMIN_ORIGIN = 'https://admin.takotransport.online';

      window.addEventListener('message', (event) => {
        if (event.origin !== ADMIN_ORIGIN) return;
        if (event.data?.type === 'tako-driver-authenticated') {
          localStorage.setItem(DRIVER_CONNECTED_KEY, '1');
        }
        if (event.data?.type === 'tako-driver-disconnected') {
          localStorage.removeItem(DRIVER_CONNECTED_KEY);
          driverFrame.src = `${ADMIN_ORIGIN}/driver-login?refresh=${Date.now()}`;
        }
      });

      driverFrame.addEventListener('load', () => {
        document.body.classList.add('driver-ready');
      }, { once: true });
      const initialRoute = localStorage.getItem(DRIVER_CONNECTED_KEY) === '1'
        ? '/driver-dashboard'
        : '/driver-login';
      driverFrame.src = `${ADMIN_ORIGIN}${initialRoute}?refresh=${Date.now()}`;
    </script>
  </body>
</html>
