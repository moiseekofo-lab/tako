<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="theme-color" content="#061f68" />
    <title>Activation carte NFC | TaKo Transport</title>
    <meta name="description" content="Activez votre carte NFC TaKo Transport en toute sécurité." />
    <link rel="icon" type="image/png" href="/tako-logo.png" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; background: #fff; }
      body { overflow: hidden; font-family: Arial, sans-serif; }
      iframe { width: 100%; height: 100%; border: 0; display: block; }
      .error { min-height: 100%; display: none; place-items: center; padding: 24px; background: #f5f8ff; }
      .error-card { width: 100%; max-width: 460px; padding: 32px; border-radius: 20px; background: #fff; box-shadow: 0 16px 42px rgba(6,31,104,.12); text-align: center; }
      h1 { margin: 0 0 12px; color: #061f68; font-size: 27px; }
      p { margin: 0; color: #5c667a; font-size: 16px; line-height: 1.55; }
    </style>
  </head>
  <body>
    <iframe id="activation-frame" title="Activation carte NFC TaKo"></iframe>
    <main id="activation-error" class="error">
      <section class="error-card">
        <h1>UID NFC manquant ou invalide</h1>
        <p>Utilisez le lien inscrit sur votre carte TaKo ou vérifiez l’adresse reçue.</p>
      </section>
    </main>
    <script>
      const uid = new URLSearchParams(window.location.search).get('uid')?.trim() || '';
      const frame = document.getElementById('activation-frame');
      const error = document.getElementById('activation-error');
      if (/^[A-Za-z0-9:_-]{4,128}$/.test(uid)) {
        frame.src = `https://admin.takotransport.online/agent-prepaid?uid=${encodeURIComponent(uid)}`;
      } else {
        frame.remove();
        error.style.display = 'grid';
      }
    </script>
  </body>
</html>
